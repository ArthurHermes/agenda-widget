<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Evento</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      .content { flex: 1; overflow-y: auto; padding: 18px 20px; }
      #title { font-size: 18px; font-weight: 600; padding: 8px 10px; margin-bottom: 14px; }
      .dt { display: grid; grid-template-columns: 70px 1fr 110px; gap: 8px; align-items: center; margin-bottom: 8px; }
      .dt span { color: var(--muted); font-size: 12px; }
      body.all-day .dt input[type="time"] { visibility: hidden; }
      .note { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
      #cal-dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
    </style>
    <script type="module" src="event.js"></script>
  </head>
  <body>
    <div class="content">
      <input id="title" placeholder="Adicionar título" autofocus />

      <label class="field"><span>Agenda</span>
        <div class="row"><span id="cal-dot" class="auto"></span><select id="calendar"></select></div>
      </label>

      <label class="check"><input type="checkbox" id="all-day" /> Dia inteiro</label>
      <div class="dt"><span>Início</span><input type="date" id="start-date" /><input type="time" id="start-time" step="300" /></div>
      <div class="dt"><span>Fim</span><input type="date" id="end-date" /><input type="time" id="end-time" step="300" /></div>

      <label class="field" style="margin-top: 12px"><span>Local</span><input id="location" placeholder="Endereço ou link" /></label>
      <label class="field"><span>Descrição</span><textarea id="description" rows="5"></textarea></label>

      <div id="recurring-note" class="note" hidden>
        Este é um evento recorrente: as alterações e a exclusão valem <b>só para esta ocorrência</b>.
        Para mudar a série inteira, use “Abrir no Google”.
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="bottom-bar">
      <button id="btn-delete" class="danger" hidden>Excluir</button>
      <button id="btn-google" hidden>Abrir no Google</button>
      <span class="spacer"></span>
      <button id="btn-cancel">Cancelar</button>
      <button id="btn-save" class="primary">Salvar</button>
    </div>
  </body>
</html>
